<!doctype html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Zeta - Material 3 Expressive Task & Focus App" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="zeta" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Zeta</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
      }
      @media (prefers-color-scheme: dark) {
        body,
        #web-splash {
          background-color: #000000 !important;
        }
      }
      #web-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #ffffff;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 0.3s ease-out;
      }
      .web-splash-logo {
        width: 120px;
        height: 120px;
        border-radius: 24px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="web-splash">
      <img class="web-splash-logo" src="icons/Icon-192.png" alt="Zeta Logo" />
    </div>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      function hideWebSplash() {
        const splash = document.getElementById("web-splash");
        if (splash && splash.dataset.dismissed !== "true") {
          splash.dataset.dismissed = "true";
          splash.style.opacity = "0";
          setTimeout(function () {
            if (splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 350);
        }
      }

      // 1. Dismiss when Flutter renders the first frame
      window.addEventListener("flutter-first-frame", hideWebSplash);

      // 2. Fallback: Dismiss when Flutter DOM elements mount
      const splashObserver = new MutationObserver(function (_, obs) {
        if (document.querySelector("flutter-view, flt-glass-pane")) {
          setTimeout(hideWebSplash, 100);
          obs.disconnect();
        }
      });
      splashObserver.observe(document.body, { childList: true, subtree: true });

      // 3. Fallback safety timer
      setTimeout(hideWebSplash, 3000);
    </script>
  </body>
</html>
