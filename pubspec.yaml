name: zeta
description: "Zeta - Flutter clone of Sharva (Xeno) with Material 3 Expressive UI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  material_3_expressive: ^1.1.2
  go_router: ^14.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  material_color_utilities: ^0.13.0
  google_fonts: ^6.0.0
  http: ^1.6.0
  file_picker: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
