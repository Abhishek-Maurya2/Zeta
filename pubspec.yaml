name: zeta
description: "Zeta - Flutter clone of Sharva (Xeno) with Material 3 Expressive UI"
publish_to: 'none'
version: 1.2.8+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  material_3_expressive: ^1.1.2
  go_router: ^14.0.0
  provider: ^6.1.0
  shared_preferences: ^2.3.0
  material_color_utilities: ^0.13.0
  google_fonts: ^6.0.0
  http: ^1.6.0
  file_picker: ^12.3.0
  supabase_flutter: ^2.12.0
  url_launcher: ^6.3.0
  quick_actions: ^1.1.0
  uuid: ^4.5.1
  flutter_svg: ^2.3.0
  ffi: ^2.2.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.5
  open_filex: ^4.5.0
  dio: ^5.7.0
  wakelock_plus: ^1.8.0
  web: ^1.1.1
  geolocator: ^13.0.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  local_notifier: ^0.1.6
  flutter_desktop_notifications: ^1.1.2
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  dynamic_color: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

  fonts:
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
    - family: RobotoFlex
      fonts:
        - asset: assets/fonts/RobotoFlex-Variable.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Variable.ttf
    - family: RobotoSerif
      fonts:
        - asset: assets/fonts/RobotoSerif-Variable.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf

flutter_launcher_icons:
  android: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/logo.png"
    background_color: "#1E1E2E"
    theme_color: "#6750A4"
  windows:
    generate: true
    image_path: "assets/logo/logo.png"
    icon_size: 48
