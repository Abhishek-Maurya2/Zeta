name: Deploy Web to Vercel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

jobs:
  deploy-web:
    name: Build & Deploy Web to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            VERSION_RAW="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=${VERSION_RAW}" >> $GITHUB_ENV
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          success=0
          for i in 1 2 3; do
            echo "Installing Vercel CLI (attempt $i)..."
            if npm install -g vercel@latest; then
              success=1
              break
            fi
            echo "Install failed. Retrying in 15 seconds..."
            sleep 15
          done
          if [ $success -ne 1 ]; then
            echo "Installing pinned fallback version vercel@59.17.0..."
            npm install -g vercel@59.17.0
          fi

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          cp vercel.json build/web/vercel.json || true
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./build/web --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
