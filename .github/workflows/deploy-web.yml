name: Deploy Web to Vercel

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (leave blank to auto-detect from pubspec.yaml)'
        required: false
        default: ''

jobs:
  deploy-web:
    name: Build & Deploy Web to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_RAW="${GITHUB_REF#refs/tags/v}"
            VERSION="${VERSION_RAW#refs/tags/}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          success=0
          for i in 1 2 3; do
            echo "Installing Vercel CLI (attempt $i)..."
            if npm install --global vercel@latest; then
              success=1
              break
            else
              echo "Installation failed, retrying in 5 seconds..."
              sleep 5
            fi
          done
          if [ $success -eq 0 ]; then
            echo "Failed to install Vercel CLI after 3 attempts."
            exit 1
          fi

      - name: Prepare Vercel Build Output API Structure
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          mkdir -p .vercel/output/static
          cp -r build/web/* .vercel/output/static/
          cat << 'EOF' > .vercel/output/config.json
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF
          cat << 'EOF' > .vercel/project.json
          {
            "projectId": "prj_3aKe0zAGHcowaWsuncZA6kCxvRfr",
            "orgId": "team_tAgsxqYBU5ovEIA5XIAYUpc0"
          }
          EOF

      - name: Deploy Project Artifacts to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $DEPLOYMENT_URL"
          vercel alias set "$DEPLOYMENT_URL" sharvas.vercel.app --token=${{ secrets.VERCEL_TOKEN }} || true

