name: Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (leave blank to auto-detect from pubspec.yaml)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag & Changelog
        id: get_version
        run: |
          # 1. Determine Version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_RAW="${GITHUB_REF#refs/tags/v}"
            VERSION="${VERSION_RAW#refs/tags/}"
          else
            # Auto-detect from pubspec.yaml
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "TAG_NAME=v${VERSION}" >> $GITHUB_ENV
          echo "Releasing version: ${VERSION} with tag: v${VERSION}"

          # 2. Extract commit message as changelog
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="Zeta v${VERSION} update"
          fi
          echo "$COMMIT_MSG" > release_notes.md
          echo "Changelog extracted from commit message:"
          cat release_notes.md

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/zeta-${{ env.VERSION }}.apk

      - name: Upload Android Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/zeta-${{ env.VERSION }}.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Ensure release exists with commit message as changelog
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Creating release $TAG_NAME with commit message as changelog..."
            gh release create "$TAG_NAME" \
              --title "Zeta $TAG_NAME" \
              --notes-file release_notes.md \
              --target "$GITHUB_SHA" || true
          else
            echo "Release $TAG_NAME already exists. Updating notes with commit message..."
            gh release edit "$TAG_NAME" \
              --title "Zeta $TAG_NAME" \
              --notes-file release_notes.md \
              --draft=false || true
          fi

          # 2. Upload APK asset with retry
          echo "Uploading release-assets/zeta-${{ env.VERSION }}.apk..."
          uploaded=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "release-assets/zeta-${{ env.VERSION }}.apk" --clobber; then
              echo "Successfully uploaded Android APK!"
              uploaded=1
              break
            else
              echo "Upload attempt $attempt failed. Retrying in 10s..."
              sleep 10
            fi
          done

          if [ $uploaded -ne 1 ]; then
            echo "Failed to upload Android APK after 3 attempts."
            exit 1
          fi
