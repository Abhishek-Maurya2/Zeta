name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            VERSION_RAW="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=${VERSION_RAW}" >> $GITHUB_ENV
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Prepare Release Asset
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk release-assets/zeta-${{ env.VERSION }}.apk

      - name: Upload Android Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-assets/zeta-${{ env.VERSION }}.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Ensure release exists (create if not present, otherwise ensure published)
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "Zeta $TAG_NAME" \
              --generate-notes \
              --target "$GITHUB_SHA" || true
          else
            echo "Release $TAG_NAME already exists. Ensuring draft is false..."
            gh release edit "$TAG_NAME" --title "Zeta $TAG_NAME" --draft=false || true
          fi

          # 2. Upload APK asset with retry
          echo "Uploading release-assets/zeta-${{ env.VERSION }}.apk..."
          uploaded=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "release-assets/zeta-${{ env.VERSION }}.apk" --clobber; then
              echo "Successfully uploaded Android APK!"
              uploaded=1
              break
            else
              echo "Upload attempt $attempt failed. Retrying in 10s..."
              sleep 10
            fi
          done

          if [ $uploaded -ne 1 ]; then
            echo "Failed to upload Android APK after 3 attempts."
            exit 1
          fi
