name: Release Zeta

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            VERSION_RAW="${GITHUB_REF#refs/tags/v}"
            echo "VERSION=${VERSION_RAW}" >> $GITHUB_ENV
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Release APK
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build apk --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Rename APK Artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/zeta-${{ env.VERSION }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: artifacts/zeta-${{ env.VERSION }}.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Tag
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
            echo "VERSION=$ver" >> $env:GITHUB_ENV
            echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV
          } else {
            $ref = "${{ github.ref }}"
            $ver = $ref.Replace("refs/tags/v", "").Replace("refs/tags/", "")
            echo "VERSION=$ver" >> $env:GITHUB_ENV
            echo "TAG_NAME=v$ver" >> $env:GITHUB_ENV
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: pwsh
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if ($env:UPDATE_PAT) {
            flutter build windows --release --build-name="$env:VERSION" --build-number="$env:GITHUB_RUN_NUMBER" --dart-define=GITHUB_UPDATE_TOKEN="$env:UPDATE_PAT"
          } else {
            flutter build windows --release --build-name="$env:VERSION" --build-number="$env:GITHUB_RUN_NUMBER"
          }

      - name: Compile Windows Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: packaging/windows/zeta_installer.iss
          options: |
            /DMyAppVersion=${{ env.VERSION }}

      - name: Package Windows Bundle into ZIP & Installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $releaseDir = "build\windows\x64\runner\Release"
          $installerDir = "build\windows\installer"
          
          # Copy Inno Setup installer to artifacts
          if (Test-Path "$installerDir") {
            $installer = Get-ChildItem -Path "$installerDir\*.exe" | Select-Object -First 1
            if ($installer) {
              Copy-Item $installer.FullName -Destination "artifacts\zeta-setup-${{ env.VERSION }}.exe"
              Copy-Item $installer.FullName -Destination "artifacts\$($installer.Name)"
            }
          }
          
          # Create comprehensive distribution zip
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "artifacts\zeta-windows-${{ env.VERSION }}.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/*

  build-and-deploy-web:
    name: Build & Deploy Web to Vercel
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web Release
        env:
          UPDATE_PAT: ${{ secrets.UPDATE_PAT }}
        run: |
          if [ -n "$UPDATE_PAT" ]; then
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}" --dart-define=GITHUB_UPDATE_TOKEN="$UPDATE_PAT"
          else
            flutter build web --release --build-name="${{ env.VERSION }}" --build-number="${{ github.run_number }}"
          fi

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          cp vercel.json build/web/vercel.json || true
          vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd ./build/web --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=v${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display Release Files
        run: ls -la release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Zeta ${{ env.TAG_NAME }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
